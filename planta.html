<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Planta - Herbario Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="datos.js"></script>
    <style>
        :root {
            --verde-hoja: #345e37;
            --tierra-claro: #d4a373;
            --crema-fondo: #fefae0;
            --texto-oscuro: #283618;
            --blanco-transparente: rgba(255, 255, 255, 0.9);
        }
        body {
            background-color: var(--crema-fondo);
            font-family: 'Nunito', sans-serif;
            color: var(--texto-oscuro);
            padding-bottom: 80px; 
        }
        h1, h2, h3 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .foto-hero {
            position: relative;
            height: 40vh;
        }
        .fondo-difuminado-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1;
        }
        .fondo-difuminado {
            position: absolute;
            top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.7);
        }
        .contenedor-imagen-nitida {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 20px 45px 20px;
        }
        .imagen-nitida {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 3;
            background: rgba(0,0,0,0.4);
            color: white;
            border-radius: 50px;
            padding: 6px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            backdrop-filter: blur(5px);
        }

        .etiqueta-nativa {
            background-color: var(--verde-hoja);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            display: inline-block;
            margin-top: 20px;
        }
        .info-card {
            background: var(--blanco-transparente);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border-left: 5px solid var(--verde-hoja);
        }
        .info-card i {
            color: var(--tierra-claro);
            font-size: 1.5rem;
            margin-right: 10px;
        }

        .footer-fijo {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--verde-hoja);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 1000;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        /* --- Optimizaciones Móviles --- */
        @media (max-width: 768px) {
            body {
                padding-bottom: 100px; 
            }
            .btn-volver {
                top: max(20px, env(safe-area-inset-top));
                margin-top: 10px;
            }
            #titulo-planta {
                font-size: 2rem !important;
            }
            .foto-hero {
                height: 35vh; 
            }
            .info-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="foto-hero">
        <div class="fondo-difuminado-wrapper">
            <div class="fondo-difuminado" id="imagen-fondo"></div>
        </div>
        <div class="contenedor-imagen-nitida" data-bs-toggle="modal" data-bs-target="#imageModal" style="cursor: pointer;">
            <img id="imagen-planta" src="" alt="Planta" class="imagen-nitida">
        </div>
        <div class="container h-100 position-relative">
            <a href="javascript:void(0);" onclick="volverAlCatalogo()" class="btn-volver"><i class="fa-solid fa-arrow-left me-2"></i>Volver</a>
        </div>
    </div>

    <div class="container px-4">
        <div class="etiqueta-nativa" id="etiqueta-tipo"></div>
        <h1 class="mt-2 mb-0" id="titulo-planta" style="font-size: 2.5rem; color: var(--texto-oscuro);"></h1>
        <p class="text-muted fst-italic fs-5 mb-4" id="texto-cientifico"></p>

        <div class="info-card">
            <div class="info-title">
                <i class="fa-solid fa-mortar-pestle"></i>
                <h3 class="mb-0">Usos Comunitarios</h3>
            </div>
            <p class="mb-0 fs-6" id="texto-usos"></p>
        </div>

        <div class="info-card" style="border-left-color: var(--tierra-claro);">
            <div class="info-title">
                <i class="fa-solid fa-microscope"></i>
                <h3 class="mb-0" style="color: var(--tierra-claro);">Datos Botánicos</h3>
            </div>
            <p class="mb-0 fs-6" id="texto-botanica"></p>
        </div>
    </div>

    <!-- Modal for Image -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body text-center position-relative p-0">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close" style="z-index: 1050;"></button>
                    <img id="imagen-modal" src="" alt="Planta" class="img-fluid rounded shadow-lg" style="max-height: 85vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <div class="footer-fijo">
        <strong>C.E. Domingo French</strong> • Herbario Digital 3.0
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const idBuscado = parametros.get('id');
        const plantaEncontrada = baseDeDatosPlantas.find(p => p.id === idBuscado);

        if (plantaEncontrada) {
            document.title = `${plantaEncontrada.nombre} - Herbario Digital`;
            document.getElementById('titulo-planta').innerText = plantaEncontrada.nombre;
            document.getElementById('texto-cientifico').innerText = plantaEncontrada.cientifico;
            document.getElementById('etiqueta-tipo').innerText = plantaEncontrada.tipo;
            document.getElementById('texto-usos').innerText = plantaEncontrada.usos;
            document.getElementById('texto-botanica').innerText = plantaEncontrada.botanica;
            document.getElementById('imagen-fondo').style.backgroundImage = `url('${plantaEncontrada.foto}')`;
            document.getElementById('imagen-planta').src = plantaEncontrada.foto;
            document.getElementById('imagen-modal').src = plantaEncontrada.foto;
        } else {
            document.body.innerHTML = `
                <div class="container text-center mt-5 pt-5">
                    <h2 class="text-danger mb-3">Planta no encontrada</h2>
                    <p>Parece que este código QR es incorrecto o la planta aún no fue cargada.</p>
                    <a href="index.html" class="btn btn-success mt-3">Volver al catálogo</a>
                </div>
            `;
        }

        function volverAlCatalogo() {
            // Si el historial de navegación viene del index.html, volvemos hacia atrás
            // para preservar la posición del scroll
            if (document.referrer && document.referrer.includes("index.html")) {
                history.back();
            } else {
                // Si abrieron el link directo (ej. escaneando QR), los enviamos al index
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
