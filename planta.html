<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Planta - Herbario Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="datos.js"></script>
    <style>
        :root {
            --verde-hoja: #345e37;
            --tierra-claro: #d4a373;
            --crema-fondo: #fefae0;
            --texto-oscuro: #283618;
            --blanco-transparente: rgba(255, 255, 255, 0.9);
        }
        body {
            background-color: var(--crema-fondo);
            font-family: 'Nunito', sans-serif;
            color: var(--texto-oscuro);
            padding-bottom: 80px; 
        }
        h1, h2, h3 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .foto-hero {
            position: relative;
            height: 35vh;
            background-color: #ccd5ae; 
            background-size: cover;
            background-position: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-volver {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.4);
            color: white;
            border-radius: 50px;
            padding: 6px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            backdrop-filter: blur(5px);
        }
        .btn-volver:hover {
            color: white;
            background: rgba(0,0,0,0.6);
        }
        .btn-audio-flotante {
            position: absolute;
            bottom: -30px;
            right: 30px;
            background-color: var(--tierra-claro);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 6px 15px rgba(212, 163, 115, 0.5);
            border: 4px solid var(--crema-fondo);
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn-audio-flotante:active {
            transform: scale(0.9);
        }
        .etiqueta-nativa {
            background-color: var(--verde-hoja);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 800;
            display: inline-block;
            margin-top: 20px;
        }
        .info-card {
            background: var(--blanco-transparente);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border-left: 5px solid var(--verde-hoja);
        }
        .info-card i {
            color: var(--tierra-claro);
            font-size: 1.5rem;
            margin-right: 10px;
        }
        .info-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: var(--verde-hoja);
        }
        .btn-galeria {
            background-color: transparent;
            border: 2px solid var(--verde-hoja);
            color: var(--verde-hoja);
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 10px;
        }
        .footer-fijo {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--verde-hoja);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="foto-hero" id="imagen-fondo">
        <div class="container h-100 position-relative">
            <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left me-2"></i>Volver</a>
            <a href="#" class="btn-audio-flotante" id="btn-audio" onclick="alert('Acá se reproduce el audio de los alumnos')">
                <i class="fa-solid fa-volume-high"></i>
            </a>
        </div>
    </div>

    <div class="container px-4">
        <div class="etiqueta-nativa" id="etiqueta-tipo"></div>
        <h1 class="mt-2 mb-0" id="titulo-planta" style="font-size: 2.5rem; color: var(--texto-oscuro);"></h1>
        <p class="text-muted fst-italic fs-5 mb-4" id="texto-cientifico"></p>

        <div class="info-card">
            <div class="info-title">
                <i class="fa-solid fa-mortar-pestle"></i>
                <h3 class="mb-0">Usos Comunitarios</h3>
            </div>
            <p class="mb-0 fs-6" id="texto-usos"></p>
        </div>

        <div class="info-card" style="border-left-color: var(--tierra-claro);">
            <div class="info-title">
                <i class="fa-solid fa-microscope"></i>
                <h3 class="mb-0" style="color: var(--tierra-claro);">Datos Botánicos</h3>
            </div>
            <p class="mb-0 fs-6" id="texto-botanica"></p>
        </div>

        <button class="btn-galeria">
            <i class="fa-solid fa-camera-retro me-2"></i> Ver fotos de la expedición
        </button>
    </div>

    <div class="footer-fijo">
        <strong>C.E. Domingo French</strong> • Herbario Digital 3.0
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const idBuscado = parametros.get('id');
        const plantaEncontrada = baseDeDatosPlantas.find(p => p.id === idBuscado);

        if (plantaEncontrada) {
            document.title = `${plantaEncontrada.nombre} - Herbario Digital`;
            document.getElementById('titulo-planta').innerText = plantaEncontrada.nombre;
            document.getElementById('texto-cientifico').innerText = plantaEncontrada.cientifico;
            document.getElementById('etiqueta-tipo').innerText = plantaEncontrada.tipo;
            document.getElementById('texto-usos').innerText = plantaEncontrada.usos;
            document.getElementById('texto-botanica').innerText = plantaEncontrada.botanica;
            document.getElementById('imagen-fondo').style.backgroundImage = `url('${plantaEncontrada.foto}')`;
        } else {
            document.body.innerHTML = `
                <div class="container text-center mt-5 pt-5">
                    <h2 class="text-danger mb-3">Planta no encontrada</h2>
                    <p>Parece que este código QR es incorrecto o la planta aún no fue cargada.</p>
                    <a href="index.html" class="btn btn-success mt-3">Volver al catálogo</a>
                </div>
            `;
        }
    </script>
</body>
</html>
