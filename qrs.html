<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Códigos QR - Herbario Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="datos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --verde-hoja: #345e37;
            --tierra-claro: #d4a373;
            --crema-fondo: #fefae0;
            --texto-oscuro: #283618;
            --blanco: #ffffff;
        }
        body {
            background-color: var(--crema-fondo);
            font-family: 'Nunito', sans-serif;
            color: var(--texto-oscuro);
        }
        h1, h2, h3 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .header-catalogo {
            background-color: var(--verde-hoja);
            color: white;
            padding: 20px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
        }
        .btn-volver {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            position: absolute;
            left: 20px;
            top: 25px;
        }
        .qr-card {
            background: var(--blanco);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(40, 54, 24, 0.05);
            cursor: pointer;
            transition: transform 0.2s;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .qr-card:active {
            transform: scale(0.95);
        }
        .qr-card h3 {
            font-size: 1rem;
            margin-top: 10px;
            margin-bottom: 0;
            color: var(--verde-hoja);
        }
        
        /* Modal Styles */
        .modal-content {
            border-radius: 25px;
            border: none;
        }
        .modal-header {
            border-bottom: none;
            padding-bottom: 0;
        }
        .modal-body {
            text-align: center;
            padding-top: 0;
        }
        #modal-qr-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 15px;
            border: 2px dashed var(--verde-hoja);
        }

        /* Print Section Hidden by Default */
        #print-section {
            display: none;
        }

        /* Print Styles */
        @media print {
            body * {
                visibility: hidden;
            }
            html, body {
                background: white;
                margin: 0;
                padding: 0;
            }
            #print-section, #print-section * {
                visibility: visible;
            }
            #print-section {
                display: flex !important;
                position: absolute;
                left: 50%;
                top: 2cm;
                transform: translateX(-50%);
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                width: 90%;
                max-width: 18cm;
                border: 8px solid var(--verde-hoja);
                border-radius: 40px;
                padding: 60px 40px;
                background-color: var(--crema-fondo) !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact;
            }
            #print-header {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 30px;
                border-bottom: 4px dashed var(--tierra-claro);
                padding-bottom: 25px;
                width: 100%;
            }
            #print-icon {
                font-size: 60px;
                margin-bottom: 10px;
            }
            #print-title {
                font-family: 'Quicksand', sans-serif;
                font-size: 38px;
                font-weight: bold;
                color: var(--verde-hoja) !important;
                text-transform: uppercase;
                letter-spacing: 3px;
            }
            #print-subtitle {
                font-family: 'Nunito', sans-serif;
                font-size: 22px;
                color: #555;
                font-weight: bold;
            }
            #print-qr-img {
                width: 450px;
                height: 450px;
                margin: 20px 0;
                border: 15px solid white;
                border-radius: 30px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }
            #print-plant-name {
                font-family: 'Quicksand', sans-serif;
                font-size: 48px;
                font-weight: bold;
                color: var(--texto-oscuro) !important;
                margin-top: 35px;
                padding: 15px 40px;
                background: #e9edc9 !important;
                border-radius: 60px;
                display: inline-block;
            }
            #print-footer {
                margin-top: 30px;
                font-family: 'Nunito', sans-serif;
                font-size: 20px;
                color: #666;
                font-weight: bold;
            }
        }

        /* --- Optimizaciones Móviles Pantalla --- */
        @media screen and (max-width: 768px) {
            .header-catalogo {
                padding: 25px 15px;
            }
            .header-catalogo h1 {
                font-size: 1.5rem;
            }
            .btn-volver {
                top: max(15px, env(safe-area-inset-top));
                margin-top: 5px;
            }
            .qr-card {
                padding: 10px;
            }
            .qr-card h3 {
                font-size: 0.9rem;
            }
            .modal-content {
                margin: 10px;
            }
            #btn-download, #btn-print {
                padding: 12px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="header-catalogo text-center">
        <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="h4 mb-1 mt-2">🖨️ Generador de QRs</h1>
        <p class="small mb-0">Toca un código para descargarlo o imprimirlo</p>
    </div>

    <div class="container px-3 mt-4 mb-5">
        <div class="row g-3" id="qr-grid">
            <!-- Los QRs se inyectarán aquí -->
        </div>
    </div>

    <!-- Modal para Acciones de QR -->
    <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title w-100 text-center fw-bold" id="modal-plant-name">Nombre de Planta</h5>
                    <button type="button" class="btn-close position-absolute" style="right: 20px;" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-0">Escanea para ir a la ficha digital</p>
                    
                    <div id="modal-qr-container"></div>
                    
                    <div class="d-grid gap-2 mt-3">
                        <button class="btn btn-success rounded-pill fw-bold" id="btn-download">
                            <i class="fa-solid fa-download me-2"></i>Descargar Imagen (PNG)
                        </button>
                        <button class="btn btn-outline-dark rounded-pill fw-bold" id="btn-print">
                            <i class="fa-solid fa-print me-2"></i>Imprimir Etiqueta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sección Especial para Imprimir -->
    <div id="print-section">
        <div id="print-header">
            <div id="print-icon">🌿</div>
            <div id="print-title">Herbario Digital</div>
            <div id="print-subtitle">C.E. Domingo French</div>
        </div>
        <img id="print-qr-img" src="" alt="QR Code">
        <div id="print-plant-name">Nombre de la Planta</div>
        <div id="print-footer"><i class="fa-solid fa-camera me-2"></i>Escanea para ver información detallada</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const qrGrid = document.getElementById('qr-grid');
        const modal = new bootstrap.Modal(document.getElementById('qrModal'));
        const modalPlantName = document.getElementById('modal-plant-name');
        const modalQrContainer = document.getElementById('modal-qr-container');
        const btnDownload = document.getElementById('btn-download');
        const btnPrint = document.getElementById('btn-print');
        
        // Print elements
        const printQrImg = document.getElementById('print-qr-img');
        const printPlantName = document.getElementById('print-plant-name');

        let currentQrDataUrl = '';
        let currentPlantName = '';

        // Obtener URL base para los enlaces (ej: https://midominio.com/planta.html?id=)
        const baseUrl = window.location.href.replace('qrs.html', 'planta.html');

        // Renderizar todos los QRs en la grilla
        baseDeDatosPlantas.forEach(planta => {
            const col = document.createElement('div');
            col.className = 'col-6 col-md-4 col-lg-3';
            
            const card = document.createElement('div');
            card.className = 'qr-card';
            
            const qrDiv = document.createElement('div');
            
            // Generar QR pequeño para la tarjeta
            const urlPlanta = baseUrl + "?id=" + planta.id;
            new QRCode(qrDiv, {
                text: urlPlanta,
                width: 120,
                height: 120,
                colorDark : "#283618",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            const title = document.createElement('h3');
            title.textContent = planta.nombre;

            card.appendChild(qrDiv);
            card.appendChild(title);
            col.appendChild(card);
            qrGrid.appendChild(col);

            // Evento al hacer clic en la tarjeta
            card.addEventListener('click', () => {
                abrirModalQr(planta.nombre, urlPlanta);
            });
        });

        function abrirModalQr(nombre, url) {
            currentPlantName = nombre;
            modalPlantName.textContent = nombre;
            modalQrContainer.innerHTML = ''; // Limpiar anterior

            // Generar QR grande para el modal (250x250)
            const qrLector = new QRCode(modalQrContainer, {
                text: url,
                width: 250,
                height: 250,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Extraer la imagen base64 del canvas generado después de un pequeñísimo retardo 
            // (qrcode.js dibuja en el canvas de forma síncrona, pero para asegurar tomamos el canvas)
            setTimeout(() => {
                const canvas = modalQrContainer.querySelector('canvas');
                if(canvas) {
                    currentQrDataUrl = canvas.toDataURL("image/png");
                    // Preparar la zona de impresión
                    printQrImg.src = currentQrDataUrl;
                    printPlantName.textContent = nombre;
                }
            }, 50);

            modal.show();
        }

        // Funcionalidad Descargar
        btnDownload.addEventListener('click', () => {
            if(!currentQrDataUrl) return;
            const enlace = document.createElement('a');
            enlace.href = currentQrDataUrl;
            enlace.download = `QR_${currentPlantName.replace(/\s+/g, '_')}.png`;
            document.body.appendChild(enlace);
            enlace.click();
            document.body.removeChild(enlace);
        });

        // Funcionalidad Imprimir
        btnPrint.addEventListener('click', () => {
            // El navegador se encarga de usar el @media print de CSS ocultando todo excepto #print-section
            window.print();
        });

    </script>
</body>
</html>
