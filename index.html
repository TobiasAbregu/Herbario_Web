<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Herbario Digital 3.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="datos.js"></script>
    <style>
        :root {
            --verde-hoja: #345e37;
            --tierra-claro: #d4a373;
            --crema-fondo: #fefae0;
            --texto-oscuro: #283618;
            --blanco: #ffffff;
        }
        body {
            background-color: var(--crema-fondo);
            font-family: 'Nunito', sans-serif;
            color: var(--texto-oscuro);
            padding-bottom: 70px;
        }
        h1, h2, h3 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
        }
        .header-catalogo {
            background-color: var(--verde-hoja);
            color: white;
            padding: 30px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .buscador-caja {
            background: var(--blanco);
            border-radius: 15px;
            padding: 5px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-top: -20px;
        }
        .buscador-caja input {
            border: none;
            box-shadow: none !important;
        }
        .item-planta {
            background: var(--blanco);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 12px rgba(40, 54, 24, 0.05);
            margin-bottom: 20px;
            border: none;
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            padding: 12px;
            transition: transform 0.2s;
        }
        .item-planta:active {
            transform: scale(0.98);
        }
        .mini-foto {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--verde-hoja);
            font-size: 1.5rem;
        }
        .info-mini {
            margin-left: 15px;
            flex-grow: 1;
        }
        .badge-tipo {
            font-size: 0.75rem;
            background-color: #e9edc9;
            color: var(--texto-oscuro);
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
        }
        .flecha-ir {
            color: var(--tierra-claro);
            font-size: 1.2rem;
            padding-right: 10px;
        }
        .footer-fijo {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--verde-hoja);
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.85rem;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="header-catalogo text-center">
        <p class="mb-1 text-uppercase small fw-bold" style="opacity: 0.8;">C.E. Domingo French</p>
        <h1 class="h3 mb-1">🌿 Explorador del Monte</h1>
        <p class="small mb-2">Recorré el herbario digital</p>
    </div>

    <div class="container px-4">
        <div class="buscador-caja d-flex align-items-center">
            <i class="fa-solid fa-magnifying-glass text-muted me-2"></i>
            <input type="text" class="form-control" placeholder="Buscar planta..." id="buscarPlanta">
        </div>
    </div>

    <div class="container px-4 mt-4" id="lista-plantas"></div>

    <div class="footer-fijo">
        Herbario Digital 3.0 • Villa de Pocho
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const contenedorLista = document.getElementById('lista-plantas');
        
        // Renderizar lista inicial
        function renderizarPlantas(plantas) {
            contenedorLista.innerHTML = '';
            plantas.forEach(planta => {
                const htmlPlanta = `
                <a href="planta.html?id=${planta.id}" class="item-planta">
                    <div class="mini-foto" style="background-color: ${planta.colorIcono};">
                        <i class="fa-solid ${planta.icono}"></i>
                    </div>
                    <div class="info-mini">
                        <span class="badge-tipo">${planta.tipo}</span>
                        <h2 class="h5 mb-0 mt-1">${planta.nombre}</h2>
                        <p class="text-muted small mb-0">${planta.cientifico}</p>
                    </div>
                    <div class="flecha-ir">
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                </a>`;
                contenedorLista.innerHTML += htmlPlanta;
            });
        }

        renderizarPlantas(baseDeDatosPlantas);

        // Buscador
        document.getElementById('buscarPlanta').addEventListener('input', function(e) {
            let termino = e.target.value.toLowerCase();
            let plantasFiltradas = baseDeDatosPlantas.filter(planta => 
                planta.nombre.toLowerCase().includes(termino) || 
                planta.cientifico.toLowerCase().includes(termino)
            );
            renderizarPlantas(plantasFiltradas);
        });
    </script>
</body>
</html>
